name: Update package versions
on:
  workflow_run:
    workflows:
      - "Build Docker Image"
    types:
      - "completed"
    branches:
      - "develop"
  pull_request:
    paths:
      - ".github/workflows/versions.yml"
  push:
    branches:
      - "develop"
    paths:
      - ".github/workflows/versions.yml"

jobs:
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update package versions
        uses: docker://ghcr.io/anchore/syft:v1.48.0@sha256:b4f1df79f97b817682d8b5ff941eb6bfe74f6172553a5e312c75bbc2eabc405c
        with:
          args: ghcr.io/${{ github.repository_owner }}/sonarr:develop -o table=package_versions.txt

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package_versions.txt
          if git diff --staged --quiet; then
            echo "No changes since last run"
          else
            git commit -m "Updating Package Versions"
            git push
          fi
